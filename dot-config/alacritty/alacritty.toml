# [general]
# working_directory = "$env:USEPROFILE"
[window]
opacity = 0.9
padding.x = 25
padding.y = 25
decorations = "None"
blur = true
position = { x = 5, y = 500 }
dimensions = { columns = 80, lines = 40 }

[terminal]
shell = { program = "pwsh.exe", args = ["-NoLogo"] }


[[foo.bar]]
elem = "key"

[font]
#normal.family = 'FiraCode Nerd Font Mono Ret'
#bold.family = 'FiraCode Nerd Font Mono Ret'
#italic.family = 'FiraCode Nerd Font Mono Ret'
#bold_italic.family = 'FiraCode Nerd Font Mono Ret'
normal.family = 'Cascadia Mono'
bold.family = 'Cascadia Mono'
italic.family = 'Cascadia Mono'
bold_italic.family = 'Cascadia Mono'

size = 12.0

[mouse]
bindings = [
    { mouse = "Left", action = "ExpandSelection" },
    { mouse = "Left", mods = "Control", action = "Open" },
    { mouse = "Right", action = "Paste" },
]
